<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Stefan!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');
:root {
  --orange:#FF6B35; --teal:#00C9A7; --pink:#FF4E8C;
  --tape-brown:#5C3A1E; --tape-light:#7a4e2a;
  --bg:#0d0d0d; --chrome:#c0c0c0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 20%,rgba(255,107,53,.06) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(0,201,167,.05) 0%,transparent 50%);
  font-family:'Space Mono',monospace;color:#f0f0f0;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:2rem 1rem 5rem;overflow-x:hidden;
}
/* header */
.hdr{text-align:center;margin-bottom:2.5rem;animation:fadeDown .8s ease both}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,6vw,4rem);
  letter-spacing:.08em;color:var(--orange);text-shadow:0 0 40px rgba(255,107,53,.3);line-height:1}
.hdr p{font-size:.65rem;letter-spacing:.25em;color:#666;text-transform:uppercase;margin-top:.5rem}
/* walkman */
.wm-wrap{width:min(380px,95vw);animation:fadeUp .9s .2s ease both}
.wm{
  background:linear-gradient(160deg,#2e2e2e 0%,#1a1a1a 45%,#222 100%);
  border-radius:18px 18px 24px 24px;padding:16px 18px 20px;
  box-shadow:inset 0 2px 0 #484848,inset 0 -2px 0 #0d0d0d,
    inset 2px 0 0 #333,inset -2px 0 0 #111,
    0 24px 60px rgba(0,0,0,.85),0 4px 0 #111;
  border:1px solid #383838;position:relative
}
.wm::before{content:'';position:absolute;top:6px;left:22px;right:22px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);border-radius:2px}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.18em;color:var(--chrome)}
.brand-dot{width:26px;height:26px;border:1.5px solid #555;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.46rem;font-weight:700;color:#666;letter-spacing:.06em}
/* tape window */
.tw{background:#080808;border-radius:8px;border:2px solid #404040;
  box-shadow:inset 0 0 0 1px #1a1a1a,inset 0 3px 10px rgba(0,0,0,.7);
  padding:12px 14px 10px;margin-bottom:12px;position:relative}
.tw::after{content:'';position:absolute;top:4px;left:10px;right:10px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  border-radius:1px;pointer-events:none}
.tl{text-align:center;margin-bottom:8px}
.tl-name{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:.2em;color:#555;transition:color .4s}
.tl-name.on{color:var(--orange)}
.tl-sub{font-size:.46rem;color:#444;letter-spacing:.15em;margin-top:1px;text-transform:uppercase;transition:color .4s}
.tl-sub.on{color:#777}
.spools{display:flex;align-items:center;justify-content:center}
.bridge{flex:1;height:18px;display:flex;flex-direction:column;justify-content:space-between;padding:0 2px;position:relative}
.strand{height:2.5px;background:var(--tape-brown);border-radius:1px}
.ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:7px;height:13px;background:#4a4a4a;border-radius:1px;border:1px solid #606060}
.tinfo{background:#0e0e0e;border-radius:5px;padding:5px 9px;display:flex;
  justify-content:space-between;align-items:center;margin-top:8px;border:1px solid #222}
.ttime{font-size:.52rem;color:var(--teal);letter-spacing:.1em;font-variant-numeric:tabular-nums;min-width:72px}
.tprog{flex:1;margin:0 8px;height:3px;background:#222;border-radius:2px;overflow:hidden;cursor:pointer}
.tbar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--pink));
  border-radius:2px;transition:width .5s linear}
.tstatus{font-size:.46rem;color:#333;letter-spacing:.1em;min-width:32px;text-align:right}
.tstatus.on{color:var(--teal)}
/* controls */
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;padding:2px 0}
.btn{cursor:pointer;border:1px solid #444;outline:none;
  background:linear-gradient(180deg,#3a3a3a,#252525);border-radius:50%;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  color:var(--chrome);box-shadow:0 2px 0 #0d0d0d,inset 0 1px 0 rgba(255,255,255,.04);transition:all .1s}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #0d0d0d}
.btn-p{width:52px;height:52px;background:linear-gradient(180deg,var(--orange),#c04a15);
  border-color:rgba(255,150,80,.5);color:white;
  box-shadow:0 3px 0 #7a2800,0 0 20px rgba(255,107,53,.2)}
.btn-p:active{box-shadow:0 1px 0 #7a2800}
.btn-p.on{box-shadow:0 3px 0 #7a2800,0 0 28px rgba(255,107,53,.45)}
.btn svg{pointer-events:none}
/* detail */
.dstrip{display:flex;align-items:center;gap:10px;padding:0 2px;margin-bottom:4px}
.vwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.vlbl{font-size:.42rem;color:#444;letter-spacing:.15em;text-transform:uppercase}
.vslider{-webkit-appearance:none;appearance:none;width:75px;height:3px;
  background:#2e2e2e;border-radius:2px;outline:none;cursor:pointer}
.vslider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--chrome);border:1px solid #555;cursor:pointer}
.eq{flex:1;display:flex;align-items:flex-end;gap:2px;height:20px}
.eqb{flex:1;background:#2e2e2e;border-radius:1px 1px 0 0;min-height:3px;transition:height .12s ease}
.serial{font-size:.38rem;color:#2e2e2e;letter-spacing:.18em;text-align:center;margin-top:4px}
/* shelf */
.slbl{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:.28em;color:#555;
  text-align:center;margin:2rem 0 1.2rem;text-transform:uppercase;animation:fadeUp 1s .5s ease both}
.shelf{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;
  animation:fadeUp 1s .6s ease both;max-width:900px}
/* cassette */
.cass{cursor:pointer;transition:transform .2s,filter .2s;
  filter:brightness(.8) saturate(.85);flex:0 0 auto;position:relative}
.cass:hover{transform:translateY(-5px) rotate(-1deg);filter:brightness(1) saturate(1)}
.cass.loaded{filter:brightness(1) saturate(1)}
.cass.loaded .cshell{box-shadow:0 8px 28px var(--cg),0 2px 0 #000}
/* shell: landscape ~160x100 */
.cshell{width:160px;height:100px;border-radius:5px 5px 7px 7px;
  background:var(--cc);position:relative;
  box-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 0 #000;
  border:1px solid rgba(255,255,255,.07);overflow:hidden;transition:box-shadow .3s}
.cshell::before{content:'';position:absolute;top:3px;left:6px;right:6px;height:1.5px;
  background:rgba(255,255,255,.14);border-radius:1px}
/* label */
.clabel{position:absolute;top:6px;left:6px;right:6px;height:34px;
  background:#f4efe4;border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.clabel::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(180deg,transparent,transparent 6px,rgba(0,0,0,.06) 6px,rgba(0,0,0,.06) 7px)}
.cl-name{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.12em;
  color:var(--ct);position:relative;z-index:1;line-height:1}
.cl-title{font-size:.37rem;color:#999;letter-spacing:.1em;text-transform:uppercase;
  position:relative;z-index:1;min-height:8px}
.cl-type{font-size:.33rem;color:#bbb;letter-spacing:.08em;position:relative;z-index:1}
/* window */
.cwin{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:104px;height:34px;background:rgba(0,0,0,.75);border-radius:4px;
  border:1px solid rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:space-between;padding:0 8px}
.cwt{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 4px}
.ctape{height:2px;background:var(--tape-brown);border-radius:1px}
/* bottom */
.cbot{position:absolute;bottom:0;left:0;right:0;height:14px;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px 3px}
.cnotch{width:8px;height:6px;background:rgba(0,0,0,.4);border-radius:2px 2px 0 0;border:1px solid rgba(0,0,0,.3)}
.cside{font-size:.35rem;color:rgba(255,255,255,.3);letter-spacing:.1em;font-weight:700;align-self:center}
/* corner screws */
.cs{position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#555,#222);border:1px solid #111}
.cs::after{content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(45deg);width:3px;height:.8px;background:#666}
.cs.tl{top:5px;left:5px}.cs.tr{top:5px;right:5px}.cs.bl{bottom:5px;left:5px}.cs.br{bottom:5px;right:5px}
.cbadge{position:absolute;top:-7px;right:-7px;width:16px;height:16px;
  background:var(--teal);border-radius:50%;display:none;
  align-items:center;justify-content:center;font-size:.5rem;color:#000;font-weight:700;
  box-shadow:0 0 10px rgba(0,201,167,.6);z-index:3}
.cass.loaded .cbadge{display:flex}
.ccap{text-align:center;font-size:.44rem;color:#444;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
/* hint */
.hint{margin-top:2rem;font-size:.52rem;color:#383838;letter-spacing:.18em;
  text-align:center;text-transform:uppercase;animation:fadeUp 1s .9s ease both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp  {from{opacity:0;transform:translateY( 20px)}to{opacity:1;transform:translateY(0)}}
audio{display:none}
</style>
</head>
<body>

<div class="hdr">
  <h1>Happy Birthday, Stefan!</h1>
  <p>Kassetten für dich &nbsp;·&nbsp; Von Karin, Arno &amp; David</p>
</div>

<div class="wm-wrap"><div class="wm">

  <div class="brand">
    <span class="brand-name">WalkMan Pro</span>
    <div class="brand-dot">DD</div>
  </div>

  <div class="tw">
    <div class="tl">
      <div class="tl-name" id="tlName">– Keine Kassette –</div>
      <div class="tl-sub"  id="tlSub">Wähle eine Kassette unten aus</div>
    </div>
    <div class="spools">
      <svg width="70" height="70" viewBox="0 0 68 68" style="display:block">
        <circle cx="34" cy="34" r="32" fill="#0e0e0e" stroke="#2e2e2e" stroke-width="1"/>
        <g id="lSpool" style="transform-origin:34px 34px">
          <circle cx="34" cy="34" r="27" fill="none" stroke="#5C3A1E" stroke-width="5.5" opacity=".75"/>
          <circle cx="34" cy="34" r="20" fill="none" stroke="#7a4e2a" stroke-width="3"   opacity=".55"/>
          <circle cx="34" cy="34" r="13" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
          <line x1="34" y1="21" x2="34" y2="47" stroke="#4a4a4a" stroke-width="1.8"/>
          <line x1="21" y1="34" x2="47" y2="34" stroke="#4a4a4a" stroke-width="1.8"/>
          <line x1="25" y1="25" x2="43" y2="43" stroke="#3a3a3a" stroke-width="1.2"/>
          <line x1="43" y1="25" x2="25" y2="43" stroke="#3a3a3a" stroke-width="1.2"/>
          <circle cx="34" cy="34" r="4.5" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="1"/>
        </g>
      </svg>
      <div class="bridge">
        <div class="strand"></div>
        <div class="ph"></div>
        <div class="strand"></div>
      </div>
      <svg width="70" height="70" viewBox="0 0 68 68" style="display:block">
        <circle cx="34" cy="34" r="32" fill="#0e0e0e" stroke="#2e2e2e" stroke-width="1"/>
        <g id="rSpool" style="transform-origin:34px 34px">
          <circle cx="34" cy="34" r="17" fill="none" stroke="#5C3A1E" stroke-width="3.5" opacity=".75"/>
          <circle cx="34" cy="34" r="13" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
          <line x1="34" y1="21" x2="34" y2="47" stroke="#4a4a4a" stroke-width="1.8"/>
          <line x1="21" y1="34" x2="47" y2="34" stroke="#4a4a4a" stroke-width="1.8"/>
          <line x1="25" y1="25" x2="43" y2="43" stroke="#3a3a3a" stroke-width="1.2"/>
          <line x1="43" y1="25" x2="25" y2="43" stroke="#3a3a3a" stroke-width="1.2"/>
          <circle cx="34" cy="34" r="4.5" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="1"/>
        </g>
      </svg>
    </div>
    <div class="tinfo">
      <span class="ttime" id="ttime">0:00 / 0:00</span>
      <div class="tprog" id="tprog"><div class="tbar" id="tbar"></div></div>
      <span class="tstatus" id="tstatus">–</span>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn" onclick="seekRel(-10)" title="-10s">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M7.5 2.5L2 7.5l5.5 5V2.5z" fill="currentColor"/>
        <path d="M13 2.5L7.5 7.5l5.5 5V2.5z" fill="currentColor"/>
      </svg>
    </button>
    <button class="btn btn-p" id="btnPlay" onclick="togglePlay()">
      <svg id="ico-play"  width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 3l10 6-10 6V3z" fill="white"/></svg>
      <svg id="ico-pause" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none">
        <rect x="4" y="3" width="3.5" height="12" rx="1" fill="white"/>
        <rect x="10.5" y="3" width="3.5" height="12" rx="1" fill="white"/>
      </svg>
    </button>
    <button class="btn" onclick="seekRel(10)" title="+10s">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M7.5 2.5l5.5 5-5.5 5V2.5z" fill="currentColor"/>
        <path d="M2 2.5L7.5 7.5 2 12.5V2.5z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="dstrip">
    <div class="vwrap">
      <span class="vlbl">Volume</span>
      <input type="range" class="vslider" min="0" max="1" step="0.05" value="0.8" oninput="setVol(this.value)">
    </div>
    <div class="eq" id="eq">
      <div class="eqb"></div><div class="eqb"></div><div class="eqb"></div><div class="eqb"></div>
      <div class="eqb"></div><div class="eqb"></div><div class="eqb"></div><div class="eqb"></div>
    </div>
  </div>
  <div class="serial">WM-PRO · Digital Edition · Stefan's Birthday Mix · 2025</div>
</div></div>

<div class="slbl">Wähle eine Geschichte</div>
<div class="shelf" id="shelf"></div>
<p class="hint">Kassette anklicken &nbsp;·&nbsp; dann ▶ drücken</p>
<div id="audioBox"></div>

<script>
/* =====================================================
   KASSETTEN-DATEN
   Weitere Kassetten einfach unten anhängen –
   Walkman und Regal passen sich automatisch an.
===================================================== */
const CASS = [
  { name:'Karin', title:'Meine Geschichte', file:'audio/karin.mp3',
    color:'#b84010', glow:'rgba(255,107,53,.55)', text:'#6a2500', dur:'~5 min' },
  { name:'Arno',  title:'Meine Geschichte', file:'audio/arno.mp3',
    color:'#006b56', glow:'rgba(0,201,167,.5)',   text:'#003028', dur:'~5 min' },
  { name:'David', title:'Leipzig by Night', file:'audio/Leipzig_by_Night.mp3',
    color:'#8a1a52', glow:'rgba(255,78,140,.5)',  text:'#420026', dur:'~5 min' }
  /* --- weitere Kassetten hier einfügen: ---
  ,{ name:'Name', title:'Titel', file:'name.mp3',
     color:'#1a4a8a', glow:'rgba(80,130,255,.5)', text:'#0a1a4a', dur:'~5 min' }
  */
];

/* build audio + cassette elements */
const shelf = document.getElementById('shelf');
const abox  = document.getElementById('audioBox');
const AEL   = [];

CASS.forEach((c, i) => {
  const a = document.createElement('audio');
  a.src = c.file; a.preload = 'metadata'; a.volume = .8;
  abox.appendChild(a); AEL.push(a);

  const d = document.createElement('div');
  d.className = 'cass'; d.id = 'c'+i;
  d.style.cssText = `--cc:${c.color};--cg:${c.glow};--ct:${c.text}`;
  d.onclick = () => load(i);
  d.innerHTML = `
<div class="cbadge">✓</div>
<div class="cshell">
  <div class="cs tl"></div><div class="cs tr"></div>
  <div class="cs bl"></div><div class="cs br"></div>
  <div class="clabel">
    <div class="cl-name">${c.name}</div>
    <div class="cl-title" id="ct${i}">${c.title}</div>
    <div class="cl-type">C-60 · Chrome II</div>
  </div>
  <div class="cwin">
    <svg width="26" height="26" viewBox="0 0 26 26" style="display:block;flex-shrink:0">
      <circle cx="13" cy="13" r="12" fill="#0a0a0a" stroke="#2a2a2a" stroke-width=".8"/>
      <circle cx="13" cy="13" r="9"  fill="none" stroke="#5C3A1E" stroke-width="2.5" opacity=".8"/>
      <circle cx="13" cy="13" r="5"  fill="none" stroke="#7a4e2a" stroke-width="1.5" opacity=".6"/>
      <circle cx="13" cy="13" r="3"  fill="#222" stroke="#444" stroke-width=".8"/>
      <line x1="13" y1="7" x2="13" y2="19" stroke="#3a3a3a" stroke-width="1.2"/>
      <line x1="7"  y1="13" x2="19" y2="13" stroke="#3a3a3a" stroke-width="1.2"/>
    </svg>
    <div class="cwt"><div class="ctape"></div><div class="ctape"></div></div>
    <svg width="26" height="26" viewBox="0 0 26 26" style="display:block;flex-shrink:0">
      <circle cx="13" cy="13" r="12" fill="#0a0a0a" stroke="#2a2a2a" stroke-width=".8"/>
      <circle cx="13" cy="13" r="6"  fill="none" stroke="#5C3A1E" stroke-width="1.5" opacity=".8"/>
      <circle cx="13" cy="13" r="3"  fill="#222" stroke="#444" stroke-width=".8"/>
      <line x1="13" y1="7" x2="13" y2="19" stroke="#3a3a3a" stroke-width="1.2"/>
      <line x1="7"  y1="13" x2="19" y2="13" stroke="#3a3a3a" stroke-width="1.2"/>
    </svg>
  </div>
  <div class="cbot">
    <div class="cnotch"></div>
    <span class="cside">Side A · ${c.dur}</span>
    <div class="cnotch"></div>
  </div>
</div>
<div class="ccap">${c.name}</div>`;
  shelf.appendChild(d);
});

/* player state */
let cur=-1, playing=false, spoolTmr=null, eqTmr=null, ang=0;
const lS = document.getElementById('lSpool');
const rS = document.getElementById('rSpool');
const eqBars = document.querySelectorAll('.eqb');

function load(i) {
  if (cur>=0){ AEL[cur].pause(); AEL[cur].currentTime=0; document.getElementById('c'+cur).classList.remove('loaded'); }
  stopS(); stopEQ(); playing=false; setIcon(false);
  cur=i;
  document.getElementById('c'+i).classList.add('loaded');
  document.querySelectorAll('.cass').forEach((c,j)=>{
    c.style.filter = j===i ? 'brightness(1) saturate(1)' : 'brightness(.55) saturate(.6)';
  });
  const n=document.getElementById('tlName'); n.textContent=CASS[i].name; n.classList.add('on');
  const s=document.getElementById('tlSub');  s.textContent=CASS[i].title; s.classList.add('on');
  document.getElementById('tstatus').textContent='STOPP';
  document.getElementById('tstatus').className='tstatus';
  document.getElementById('tbar').style.width='0%';
  document.getElementById('ttime').textContent='0:00 / 0:00';
  AEL[i].ontimeupdate=upTime; AEL[i].onended=onEnd;
}

function togglePlay(){
  if(cur<0){const sl=document.querySelector('.slbl');sl.style.color='var(--orange)';setTimeout(()=>sl.style.color='',700);return}
  const a=AEL[cur];
  if(playing){
    a.pause();playing=false;stopS();stopEQ();
    document.getElementById('tstatus').textContent='PAUSE';
    document.getElementById('tstatus').className='tstatus';
    setIcon(false);
  } else {
    a.play().catch(()=>{});playing=true;startS();startEQ();
    document.getElementById('tstatus').textContent='▶ PLAY';
    document.getElementById('tstatus').className='tstatus on';
    document.getElementById('btnPlay').classList.add('on');
    setIcon(true);
  }
}

function onEnd(){playing=false;stopS();stopEQ();
  document.getElementById('tstatus').textContent='ENDE';
  document.getElementById('tstatus').className='tstatus';
  document.getElementById('tbar').style.width='100%';
  setIcon(false);
}

function setIcon(p){
  document.getElementById('ico-play').style.display  = p?'none':'block';
  document.getElementById('ico-pause').style.display = p?'block':'none';
  if(!p) document.getElementById('btnPlay').classList.remove('on');
}

function seekRel(s){
  if(cur<0)return; const a=AEL[cur];
  a.currentTime=Math.max(0,Math.min(a.duration||0,a.currentTime+s));
}
function setVol(v){AEL.forEach(a=>a.volume=v)}

function upTime(){
  if(cur<0)return;
  const a=AEL[cur],c=a.currentTime||0,d=a.duration||0;
  document.getElementById('ttime').textContent=fmt(c)+' / '+fmt(d);
  const p=d>0?(c/d)*100:0;
  document.getElementById('tbar').style.width=p+'%';
  updSpool(p/100);
}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}

/* SPOOLS – both rotate CW (same direction) */
function startS(){
  if(spoolTmr)return;
  spoolTmr=setInterval(()=>{
    ang=(ang+3.8)%360;
    lS.style.transform='rotate('+ang+'deg)';
    rS.style.transform='rotate('+ang+'deg)';
  },28);
}
function stopS(){if(spoolTmr){clearInterval(spoolTmr);spoolTmr=null}}

function updSpool(p){
  const maxR=27,minR=13;
  const sup=maxR-(maxR-minR)*p;
  const tak=minR+(maxR-minR)*p;
  lS.innerHTML=rings(sup,false)+hub();
  rS.innerHTML=rings(tak,true)+hub();
}
function rings(r,small){
  if(small) return `<circle cx="34" cy="34" r="${r}" fill="none" stroke="#5C3A1E" stroke-width="3.5" opacity=".75"/>`;
  return `<circle cx="34" cy="34" r="${r}" fill="none" stroke="#5C3A1E" stroke-width="5.5" opacity=".75"/>
    <circle cx="34" cy="34" r="${Math.max(r-6,13)}" fill="none" stroke="#7a4e2a" stroke-width="3" opacity=".55"/>`;
}
function hub(){return `<circle cx="34" cy="34" r="13" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="34" y1="21" x2="34" y2="47" stroke="#4a4a4a" stroke-width="1.8"/>
  <line x1="21" y1="34" x2="47" y2="34" stroke="#4a4a4a" stroke-width="1.8"/>
  <line x1="25" y1="25" x2="43" y2="43" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="43" y1="25" x2="25" y2="43" stroke="#3a3a3a" stroke-width="1.2"/>
  <circle cx="34" cy="34" r="4.5" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="1"/>`}

/* EQ */
function startEQ(){
  if(eqTmr)return;
  eqTmr=setInterval(()=>{
    eqBars.forEach(b=>{const h=Math.floor(Math.random()*16)+3;
      b.style.height=h+'px';
      b.style.background=h>15?'var(--orange)':h>9?'var(--teal)':'#383838';
    });
  },115);
}
function stopEQ(){
  if(eqTmr){clearInterval(eqTmr);eqTmr=null}
  eqBars.forEach(b=>{b.style.height='3px';b.style.background='#2e2e2e'});
}

/* click progress to seek */
document.getElementById('tprog').addEventListener('click',function(e){
  if(cur<0)return; const a=AEL[cur]; if(!a.duration)return;
  a.currentTime=(e.offsetX/this.offsetWidth)*a.duration;
});
</script>
